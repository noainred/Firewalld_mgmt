# 프록시 규칙 예시 (문서/참고용)
# 포탈 또는 apply_rule.sh 로 입력할 값의 예시입니다.
#
# 시나리오: A 서버(10.0.1.10) 가 B 서버(10.0.2.20:80) 와 직접 통신 불가.
#           프록시 서버(10.0.1.100) 가 중계.
#           A 는 10.0.1.100:8080 으로 접속 -> B 의 80 으로 전달.

rules:
  - name: "web-A-to-B"
    description: "A 서버에서 B 서버 웹(80)으로 중계"
    source_addr: "10.0.1.10"      # A 서버 (비우면 모든 출발지 허용)
    listen_port: 8080             # 프록시가 받는 포트
    protocol: "tcp"
    dest_addr: "10.0.2.20"        # B 서버
    dest_port: 80
    enabled: true

  - name: "db-subnet-to-B"
    description: "10.0.1.0/24 대역에서 B 서버 DB(5432)로 중계"
    source_addr: "10.0.1.0/24"
    listen_port: 15432
    protocol: "tcp"
    dest_addr: "10.0.2.20"
    dest_port: 5432
    enabled: true
